name: Moat
description: 'Moat was an advertising measurement and analytics company, backed by Insight
  Venture Partners and Mayfield, that measured ad viewability, attention, and brand
  safety across digital and video advertising. Oracle acquired Moat in 2017 and folded
  it into Oracle Advertising (Oracle Moat / Oracle Data Cloud). The independent moat.com
  brand no longer operates a standalone developer program: www.moat.com now 301-redirects
  to oracle.com/advertising, and the bare moat.com host no longer negotiates TLS. This
  profile is retained in the API Evangelist network as an acquired/absorbed company
  lead with no independent public API surface.'
